[tasks.build]
description = "Build Rust/WASM engine and production frontend bundle"
run = "cd engine && wasm-pack build wasm --target web --out-dir ../../src/engine/pkg --out-name engine_wasm && cd .. && bun run build"

[tasks.start]
description = "Build Rust/WASM engine and start Vite dev server"
run = "cd engine && wasm-pack build wasm --target web --out-dir ../../src/engine/pkg --out-name engine_wasm && cd .. && bun run dev"

[tasks.wasm]
description = "Build Rust/WASM engine only"
run = "cd engine && wasm-pack build wasm --target web --out-dir ../../src/engine/pkg --out-name engine_wasm"
