[package]
name = "engine-wasm"
version = "0.0.1"
edition = "2024"
description = "wasm-bindgen wrapper for engine-core."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine-core = { path = "../core" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints.rust]
unsafe_code = "forbid"
